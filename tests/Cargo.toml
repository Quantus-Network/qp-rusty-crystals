[package]
name = "rusty-crystals-integration-tests"
version = "0.1.0"
edition = "2021"
publish = false

[features]
default = ["std"]
std = []

[dev-dependencies]
getrandom.workspace = true
qp-rusty-crystals-dilithium = { workspace = true, features = ["ml-dsa-44", "ml-dsa-65", "ml-dsa-87"] }
qp-rusty-crystals-hdwallet = { workspace = true }
rand = { workspace = true, features = ["std", "std_rng"] }
aes = "0.8"
cipher = "0.4"
