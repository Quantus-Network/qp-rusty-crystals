---
name: Continuous Integration

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Principle of least privilege: all jobs only read the repo (checkout + cargo).
# Per-job override is unnecessary because no job pushes, creates releases or PRs.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  fast-checks:
    name: 🏁 Fast Checks (Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (from rust-toolchain file)
        run: |
          rustup toolchain install
          rustup component add rustfmt --toolchain nightly
      - name: Install taplo
        run: cargo install taplo-cli --locked
      - name: Run format checks
        run: |
          taplo format --check --config taplo.toml
          cargo +nightly fmt --all -- --check

  test-workspace:
    name: 🧪 Test Workspace
    needs: fast-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (from rust-toolchain file)
        run: rustup toolchain install
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      # Dilithium ACVP KATs for ML-DSA-44/65 are behind additive features;
      # default workspace tests only exercise ML-DSA-87.
      - name: Test dilithium (all parameter sets)
        run: cargo test --locked -p qp-rusty-crystals-dilithium --all-features
      # Threshold selects one active parameter set (priority 87 > 65 > 44), so
      # --all-features never exercises 44/65. HD wallet modules coexist, but
      # default tests only enable 87. Exclusive-feature runs cover both.
      - name: Test threshold + hdwallet (ML-DSA-44 / ML-DSA-65 exclusive)
        run: |
          for variant in ml-dsa-44 ml-dsa-65; do
            echo "::group::$variant"
            cargo test --locked -p qp-rusty-crystals-threshold --no-default-features --features "std,$variant"
            cargo test --locked -p qp-rusty-crystals-hdwallet --no-default-features --features "std,$variant"
            echo "::endgroup::"
          done
      # The stack-zeroization guards are gated to optimized builds
      # (#![cfg(not(debug_assertions))]): debug codegen materializes compiler
      # temporaries of the secret key that no source-level fix can wipe, so the
      # debug `cargo test` above compiles these files to zero tests. The
      # property they guard is entirely a function of codegen, making them the
      # tests most likely to silently regress on a toolchain bump — run every
      # probe in release (security review: only the import probe used to run,
      # leaving the sign/keygen/hedge and all threshold/hdwallet probes
      # unexecuted by any job), and fail per probe if zero tests ran so a
      # gating/rename change can't turn a guard back into documentation.
      # Dilithium probes run --all-features, which stamps every ML-DSA
      # parameter set into the binary; threshold/hdwallet probes run under the
      # default (priority) set, matching what ships.
      - name: Optimized-build regression tests (stack zeroization)
        run: |
          set -o pipefail
          run_probe() {
            echo "::group::$*"
            cargo test --release --locked "$@" 2>&1 | tee stack-zeroization.log
            grep -Eq "test result: ok\. [1-9][0-9]* passed" stack-zeroization.log || {
              echo "::error::stack-zeroization probe ($*) was filtered out (0 tests ran)"
              exit 1
            }
            echo "::endgroup::"
          }
          for probe in import_stack_zeroization sign_stack_zeroization sensitive_bytes_stack_zeroization; do
            run_probe -p qp-rusty-crystals-dilithium --all-features --test "$probe"
          done
          for probe in dkg_stack_zeroization signing_stack_zeroization dealer_stack_zeroization; do
            run_probe -p qp-rusty-crystals-threshold --test "$probe"
          done
          # Release-gated unit test inside the threshold lib (painted-stack
          # probe over the derivation digest).
          run_probe -p qp-rusty-crystals-threshold --lib shares_digest_never_survives_derivation
          # The two mnemonic heap probes also run in the debug job, but the
          # word-pointer scrub in generate_mnemonic is plain (safe) stores
          # ahead of a free — exactly what dead-store elimination targets —
          # so they must additionally pass under optimized codegen.
          for probe in bip39_stack_zeroization entropy_stack_zeroization \
              hderive_stack_zeroization wormhole_stack_zeroization \
              mnemonic_heap_zeroization mnemonic_word_pointer_zeroization; do
            run_probe -p qp-rusty-crystals-hdwallet --test "$probe"
          done

  no-std-build:
    name: 📦 no_std Build (wasm32v1-none)
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (from rust-toolchain file)
        run: rustup toolchain install
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # wasm32v1-none is the target used by Substrate runtimes (chain, chain-update2512,
      # libp2p-identity-pqc, qp-libp2p-identity) which depend on these crates as no_std.
      # A regression here breaks the entire downstream stack.
      # The ml-dsa-* features must be listed explicitly: the frontends are
      # feature-gated, so a bare --no-default-features build compiles only the
      # generic core and would let a no_std regression in the public signing
      # API slip through. All three variants are built to cover every frontend.
      - name: Build dilithium for wasm32v1-none (no_std)
        run: cargo build --locked --target wasm32v1-none -p qp-rusty-crystals-dilithium --no-default-features --features ml-dsa-44,ml-dsa-65,ml-dsa-87
      - name: Build hdwallet for wasm32v1-none (no_std)
        run: cargo build --locked --target wasm32v1-none -p qp-rusty-crystals-hdwallet --no-default-features --features ml-dsa-44,ml-dsa-65,ml-dsa-87

  analysis:
    name: 🤖 Analysis (Clippy & Doc)
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (from rust-toolchain file)
        run: |
          rustup toolchain install
          rustup component add clippy rust-src
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      # --all-features never exercises the intentional "no ML-DSA frontend"
      # build: without an ml-dsa-* feature the signing core is unused, and a
      # regression that makes that configuration fail clippy (as this PR once
      # did) stays green under --all-features alone.
      - name: Run clippy (dilithium, no ML-DSA features)
        run: cargo clippy --locked -p qp-rusty-crystals-dilithium --no-default-features -- -D warnings
      - name: Run clippy (hdwallet, std only / no ML-DSA)
        run: cargo clippy --locked -p qp-rusty-crystals-hdwallet --no-default-features --features std -- -D warnings
      - name: Generate documentation
        run: cargo doc --workspace --locked --no-deps --all-features
      - name: Check documentation
        run: cargo doc --workspace --locked --no-deps --all-features --document-private-items

  stack-budget:
    name: 📏 Stack Budget (thumbv7em)
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stack-${{ hashFiles('**/Cargo.lock') }}
      # Worst single frame is currently ~107 KB (sign::signature). A 128 KB budget
      # leaves headroom for noise but trips if the ~56 KB materialized matrix A
      # ever comes back. The script installs its own pinned nightly + llvm-tools.
      - name: Check per-function stack frames against budget
        run: ./stack-check.sh 128

  security-audit:
    name: 🔒 Security Audit
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit
