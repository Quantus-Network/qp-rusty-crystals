---
name: Continuous Integration

on:
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"
  push:
    branches:
      - master
    paths-ignore:
      - "docs/**"
      - "*.md"
      - "LICENSE"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Principle of least privilege: all jobs only read the repo (checkout + cargo).
# Per-job override is unnecessary because no job pushes, creates releases or PRs.
permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  fast-checks:
    name: 🏁 Fast Checks (Format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (from rust-toolchain file)
        run: |
          rustup toolchain install
          rustup component add rustfmt --toolchain nightly
      - name: Install taplo
        run: cargo install taplo-cli --locked
      - name: Run format checks
        run: |
          taplo format --check --config taplo.toml
          cargo +nightly fmt --all -- --check

  test-workspace:
    name: 🧪 Test Workspace
    needs: fast-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (from rust-toolchain file)
        run: rustup toolchain install
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Build workspace
        run: cargo build --workspace --locked
      - name: Test workspace
        run: cargo test --workspace --locked
      # Dilithium ACVP KATs for ML-DSA-44/65 are behind additive features;
      # default workspace tests only exercise ML-DSA-87.
      - name: Test dilithium (all parameter sets)
        run: cargo test --locked -p qp-rusty-crystals-dilithium --all-features
      # Threshold selects one active parameter set (priority 87 > 65 > 44), so
      # --all-features never exercises 44/65. HD wallet modules coexist, but
      # default tests only enable 87. Exclusive-feature runs cover both.
      - name: Test threshold + hdwallet (ML-DSA-44 / ML-DSA-65 exclusive)
        run: |
          for variant in ml-dsa-44 ml-dsa-65; do
            echo "::group::$variant"
            cargo test --locked -p qp-rusty-crystals-threshold --no-default-features --features "std,$variant"
            cargo test --locked -p qp-rusty-crystals-hdwallet --no-default-features --features "std,$variant"
            echo "::endgroup::"
          done
      # The stack-zeroization guard is gated to optimized builds
      # (#![cfg(not(debug_assertions))]): debug codegen materializes compiler
      # temporaries of the secret key that no source-level fix can wipe, so the
      # debug `cargo test` above compiles this file to zero tests. The property
      # it guards is entirely a function of codegen, making it the test most
      # likely to silently regress on a toolchain bump — run it in release, and
      # fail if zero tests ran so a gating/rename change can't turn the guard
      # back into documentation.
      - name: Optimized-build regression tests (stack zeroization)
        run: |
          set -o pipefail
          cargo test --release --locked -p qp-rusty-crystals-dilithium --all-features \
            --test import_stack_zeroization 2>&1 | tee stack-zeroization.log
          grep -Eq "test result: ok\. [1-9][0-9]* passed" stack-zeroization.log || {
            echo "::error::stack-zeroization tests were filtered out (0 tests ran)"
            exit 1
          }

  no-std-build:
    name: 📦 no_std Build (wasm32v1-none)
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (from rust-toolchain file)
        run: rustup toolchain install
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}
      # wasm32v1-none is the target used by Substrate runtimes (chain, chain-update2512,
      # libp2p-identity-pqc, qp-libp2p-identity) which depend on these crates as no_std.
      # A regression here breaks the entire downstream stack.
      # The ml-dsa-* features must be listed explicitly: the frontends are
      # feature-gated, so a bare --no-default-features build compiles only the
      # generic core and would let a no_std regression in the public signing
      # API slip through. All three variants are built to cover every frontend.
      - name: Build dilithium for wasm32v1-none (no_std)
        run: cargo build --locked --target wasm32v1-none -p qp-rusty-crystals-dilithium --no-default-features --features ml-dsa-44,ml-dsa-65,ml-dsa-87
      - name: Build hdwallet for wasm32v1-none (no_std)
        run: cargo build --locked --target wasm32v1-none -p qp-rusty-crystals-hdwallet --no-default-features --features ml-dsa-44,ml-dsa-65,ml-dsa-87

  analysis:
    name: 🤖 Analysis (Clippy & Doc)
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain (from rust-toolchain file)
        run: |
          rustup toolchain install
          rustup component add clippy rust-src
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - name: Run clippy (workspace)
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Generate documentation
        run: cargo doc --workspace --locked --no-deps --all-features
      - name: Check documentation
        run: cargo doc --workspace --locked --no-deps --all-features --document-private-items

  stack-budget:
    name: 📏 Stack Budget (thumbv7em)
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stack-${{ hashFiles('**/Cargo.lock') }}
      # Worst single frame is currently ~107 KB (sign::signature). A 128 KB budget
      # leaves headroom for noise but trips if the ~56 KB materialized matrix A
      # ever comes back. The script installs its own pinned nightly + llvm-tools.
      - name: Check per-function stack frames against budget
        run: ./stack-check.sh 128

  security-audit:
    name: 🔒 Security Audit
    needs: fast-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Run security audit
        run: cargo audit
