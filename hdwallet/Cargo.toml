[package]
name = "qp-rusty-crystals-hdwallet"
version = "4.1.1"
edition = "2021"
license = "GPL-3.0-only"
description = "Pure Quantus RUST implementation of HD wallet functionality with post-quantum cryptography"
readme = "README.md"
homepage = "https://www.quantus.com"
repository = "https://github.com/Quantus-Network/qp-rusty-crystals"
keywords = [
	"cryptography",
	"hdwallet",
	"post-quantum",
	"quantum",
	"quantus-network",
]
categories = ["cryptography"]

[dependencies]
# Parameter sets are selected through this crate's own ml-dsa-* features
# (workspace pins dilithium with default-features = false).
qp-rusty-crystals-dilithium = { workspace = true }
thiserror.workspace = true
unicode-normalization.workspace = true
qp-poseidon-core.workspace = true
zeroize = { workspace = true, features = ["alloc"] }

# Dependency for the hderive module. The HMAC
# construction is implemented in-crate with zeroizing buffers; the `hmac`
# crate's non-zeroizing state objects leaked secrets into dead stack memory
# (security review), so it is intentionally not used here.
sha2.workspace = true

[dev-dependencies]
# Reference BIP-0039 implementation the in-crate `mnemonic` module is tested
# against.
bip39.workspace = true
hex-literal.workspace = true
rand.workspace = true
# Reference HMAC implementation for the stack-zeroization regression test.
hmac.workspace = true
psm.workspace = true
qp-rusty-crystals-test-utils = { workspace = true }

[features]
default = ["ml-dsa-87", "std"]
std = ["thiserror/std"]
# ML-DSA parameter sets. Additive: enabling several exposes a key-derivation
# module per variant (`ml_dsa_44` / `ml_dsa_65` / `ml_dsa_87`). The top-level
# `derive_key_*` functions remain the ML-DSA-87 API and require `ml-dsa-87`.
ml-dsa-44 = ["qp-rusty-crystals-dilithium/ml-dsa-44"]
ml-dsa-65 = ["qp-rusty-crystals-dilithium/ml-dsa-65"]
ml-dsa-87 = ["qp-rusty-crystals-dilithium/ml-dsa-87"]
