[package]
name = "qp-rusty-crystals-threshold"
version = "3.0.0"
edition = "2021"
authors = ["Quantus Network"]
license = "GPL-3.0"
description = "Threshold ML-DSA signature scheme (FIPS 204 parameter sets)"
readme = "README.md"
homepage = "https://www.quantus.com"
repository = "https://github.com/Quantus-Network/qp-rusty-crystals"
keywords = ["cryptography", "dilithium", "ml-dsa", "post-quantum", "threshold"]
categories = ["cryptography"]

[dependencies]
# Core dependencies
zeroize = { workspace = true, features = ["alloc"] }

# Logging (no_std compatible)
log = { workspace = true }

# Serialization
borsh = { workspace = true }

# Local dependencies - reuse dilithium implementation (features via crate features below).
qp-rusty-crystals-dilithium = { workspace = true }

# no_std math support
libm = { workspace = true }

[dev-dependencies]
# Integration tests parse captured DKG wire frames (e.g. the stack
# zeroization probes reconstruct subset seeds from Round 1/2 messages).
borsh = { workspace = true }
criterion = { workspace = true }
hex = { workspace = true }
hex-literal = { workspace = true }
rand = { workspace = true }
# Painted-stack probe for stack-zeroization regression tests (also used
# directly by the unit-test probe in `derivation.rs`).
psm = "=0.1.31"
qp-rusty-crystals-test-utils = { workspace = true }
# Self-referential dev-dependency: enables the internal-test-helpers feature
# for this crate's own test builds only, so the adversary-simulation
# integration tests can forge/tamper secret-bearing wire types while the
# production API keeps them opaque. Path-only dev-dependencies are stripped
# on publish.
qp-rusty-crystals-threshold = { path = ".", features = ["internal-test-helpers"] }

[features]
default = ["ml-dsa-87", "std"]
std = ["zeroize/std"]
ml-dsa-44 = ["qp-rusty-crystals-dilithium/ml-dsa-44"]
ml-dsa-65 = ["qp-rusty-crystals-dilithium/ml-dsa-65"]
ml-dsa-87 = ["qp-rusty-crystals-dilithium/ml-dsa-87"]
# Test-only escape hatches (doc(hidden) constructors/accessors) for
# secret-bearing resharing wire types, used by this crate's own
# adversary-simulation tests. NEVER enable in production builds.
internal-test-helpers = []

[[bench]]
name = "threshold_benchmarks"
harness = false
