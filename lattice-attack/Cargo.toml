[package]
name = "qp-rusty-crystals-lattice-attack"
version = "0.1.0"
edition = "2021"
publish = false
license = "GPL-3.0"
description = "Timed lattice-reduction challenge and verifier for the ML-DSA key-recovery lattice"

[dependencies]
qp-rusty-crystals-dilithium = { workspace = true, features = [
	"ml-dsa-44",
	"ml-dsa-65",
	"ml-dsa-87",
] }
num-bigint = { version = "=0.4.6", default-features = false, features = ["std"] }
num-traits = { version = "=0.2.19", default-features = false, features = ["std"] }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["float_roundtrip", "std"] }
