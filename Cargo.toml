[workspace]
members = [
	"dilithium",
	"hdwallet",
	"lattice-attack",
	"test-utils",
	"tests",
	"threshold",
]
resolver = "2"

[workspace.dependencies]
aes = { version = "=0.8.4", default-features = false }
# `zeroize` is required: without it, dropped `Mnemonic` values leave their
# word-index buffer (from which the phrase is reconstructible) in dead memory.
bip39 = { version = "=2.2.2", default-features = false, features = ["zeroize"] }
borsh = { version = "=1.6.1", default-features = false, features = ["derive"] }
cipher = { version = "=0.4.4", default-features = false }
criterion = { version = "=0.5.1", features = ["html_reports"] }
hex = { version = "=0.4.3", default-features = false, features = ["alloc"] }
hex-literal = { version = "=0.4.1", default-features = false }
hmac = { version = "=0.12.1", default-features = false }
libm = { version = "=0.2.11" }
log = { version = "=0.4.29", default-features = false }
# Painted-stack probe used by the stack-zeroization regression tests.
psm = { version = "=0.1.31" }
qp-poseidon-core = { version = "=3.1.0", default-features = false }
qp-rusty-crystals-dilithium = { path = "./dilithium", version = "4.1.1", default-features = false }
qp-rusty-crystals-hdwallet = { path = "./hdwallet", version = "4.1.1", default-features = false }
qp-rusty-crystals-test-utils = { path = "./test-utils" }
qp-rusty-crystals-threshold = { path = "./threshold", version = "=3.0.0", default-features = false }
rand = { version = "=0.10.1", default-features = false, features = ["std_rng", "thread_rng"] }
serde = { version = "=1.0.228", default-features = false, features = ["alloc", "derive"] }
serde_json = { version = "=1.0.150", default-features = false, features = ["alloc"] }
sha2 = { version = "=0.10.9", default-features = false }
unicode-normalization = { version = "=0.1.25", default-features = false }
zeroize = { version = "=1.8.2", default-features = false, features = ["derive"] }
